name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers on tag pushes like v1.0.0, v2.1.3

permissions:
  contents: write # Required to upload assets to GitHub Releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libayatana-appindicator3-dev patchelf libpulse-dev libasound2-dev xvfb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: nuitka-backend-${{ github.ref_name }}
          restore-keys: |
            nuitka-backend-

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv pip install --system . nuitka ordered-set

      - name: Create entry point
        run: |
          cat > run_main.py << 'ENTRY'
          import os
          import sys

          def _dispatch() -> int:
              prog_names = {os.path.basename(sys.argv[0])} if sys.argv else {"select-to-speech"}
              onefile_bin = os.environ.get("NUITKA_ONEFILE_BINARY")
              if onefile_bin:
                  prog_names.add(os.path.basename(onefile_bin))

              if "select-to-speech-check" in prog_names or "--check" in sys.argv:
                  if "--check" in sys.argv:
                      sys.argv.remove("--check")
                  from select_to_speech.system_check import main_check
                  return main_check()
              if "select-to-speech-audio" in prog_names or "--audio-devices" in sys.argv:
                  if "--audio-devices" in sys.argv:
                      sys.argv.remove("--audio-devices")
                  from select_to_speech.system_check import main_audio_devices
                  return main_audio_devices()
              if "select-to-speech-download" in prog_names or "--download" in sys.argv:
                  if "--download" in sys.argv:
                      sys.argv.remove("--download")
                  from select_to_speech.voice_manager import download_kokoro_cli
                  download_kokoro_cli()
                  return 0
              if len(sys.argv) > 1 and any(a in sys.argv for a in ("-h", "--help")):
                  print("Select-to-Speech daemon & backend server")
                  print("Usage: select-to-speech [options]")
                  print("\nOptions:")
                  print("  -h, --help         Show this help message and exit")
                  print("  --check            Run system dependency check")
                  print("  --audio-devices    List available audio output devices")
                  print("  --download         Download Kokoro TTS model files")
                  return 0
              from select_to_speech.main import main
              return main()

          if __name__ == "__main__":
              sys.exit(_dispatch())
          ENTRY
          sed -i 's/^          //' run_main.py

      - name: Build single multi-call binary with Nuitka
        run: |
          # Note: ccache is already in PATH via hendrikmuhs/ccache-action symlinks
          NUITKA_FLAGS=(
            --onefile
            --onefile-tempdir-spec="{CACHE_DIR}/select-to-speech/${{ github.ref_name }}"
            --lto=yes
            --python-flag=no_site
            --python-flag=no_docstrings
            --python-flag=no_asserts
            --nofollow-import-to=pytest,unittest,doctest,pdb,tkinter,idlelib,pulsectl.tests,sherpa_onnx.cli,pynput.keyboard._darwin,pynput.keyboard._win32,pynput.mouse._darwin,pynput.mouse._win32,pynput._util.darwin,pynput._util.win32
            --include-package=select_to_speech
            --include-package=sherpa_onnx
            --include-package=uvicorn
            --include-package=fastapi
            --include-package=pydantic
            --include-package=pulsectl
            --include-package=lingua
            --include-package=pedalboard
            --include-module=pedalboard_native
            --include-package=pynput
            --include-package=Xlib
            --include-package=pyaudio
            --include-package=yaml
            --include-package=emoji
            --include-package=requests
            --include-package=urllib3
            --include-package=certifi
            --include-package-data=lingua
            --include-package-data=emoji
            --include-package-data=certifi
          )

          echo "=========================================="
          echo "Building unified select-to-speech binary"
          echo "=========================================="
          python -m nuitka "${NUITKA_FLAGS[@]}" \
            --output-filename="select-to-speech" \
            "run_main.py"

          # Create multi-call symlinks for auxiliary CLI tools
          ln -sf select-to-speech select-to-speech-check
          ln -sf select-to-speech select-to-speech-audio
          ln -sf select-to-speech select-to-speech-download

      - name: Smoke test binaries
        run: |
          echo "--- Testing select-to-speech ---"
          xvfb-run -a ./select-to-speech --help
          echo "--- Testing select-to-speech-check ---"
          xvfb-run -a ./select-to-speech-check --help
          echo "--- Testing select-to-speech-audio ---"
          xvfb-run -a ./select-to-speech-audio --help
          echo "--- Testing select-to-speech-download ---"
          xvfb-run -a ./select-to-speech-download --help

      - name: Package Backend
        run: |
          mkdir -p dist
          cp -P select-to-speech select-to-speech-check select-to-speech-audio select-to-speech-download dist/
          chmod +x dist/select-to-speech
          tar -czf select-to-speech-backend-linux.tar.gz -C dist .

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-linux
          path: select-to-speech-backend-linux.tar.gz

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: |
          cd src/ui
          flutter pub get

      - name: Build Flutter Linux Release
        run: |
          cd src/ui
          flutter build linux --release

      - name: Package GUI Bundle
        run: |
          # Package the release bundle
          tar -czf select-to-speech-gui-linux.tar.gz -C src/ui/build/linux/x64/release/bundle .

      - name: Upload GUI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-linux
          path: select-to-speech-gui-linux.tar.gz

  release:
    needs: [build-backend, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-linux
          
      - name: Download GUI Artifact
        uses: actions/download-artifact@v4
        with:
          name: gui-linux
          
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "Select-to-Speech ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            select-to-speech-backend-linux.tar.gz
            select-to-speech-gui-linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
