name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers on tag pushes like v1.0.0, v2.1.3
  workflow_dispatch: # Manual run: builds and tests the packages without publishing a release

permissions:
  contents: write # Required to upload assets to GitHub Releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# All jobs build on Ubuntu 22.04 (glibc 2.35, GLib 2.72) so the binaries also run on
# Debian 12 / Ubuntu 22.04 and newer; Arch and Fedora are newer still.
jobs:
  build-backend:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libpulse-dev libasound2-dev patchelf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: nuitka-backend-${{ github.ref_name }}
          restore-keys: |
            nuitka-backend-

      - name: Cache slim lingua build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            build/lingua-rs/target
          key: lingua-${{ hashFiles('packaging/build-lingua.sh') }}

      - name: Install locked Python dependencies
        # Use the setup-python interpreter (not a uv-managed one) for Nuitka
        env:
          UV_PYTHON_PREFERENCE: only-system
        run: uv sync --frozen --no-dev --no-editable --python python3.12

      - name: Build slim lingua (only the languages the app can speak)
        run: PYTHON=.venv/bin/python packaging/build-lingua.sh

      - name: Compile backend with Nuitka (standalone)
        run: PYTHON=.venv/bin/python packaging/build-backend.sh

      - name: Smoke test backend
        run: |
          dist/backend/select-to-speech --help
          dist/backend/select-to-speech --check --lang en || true

      - name: Archive backend
        run: tar -C dist -czf backend.tar.gz backend

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: backend.tar.gz

  build-gui:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev patchelf

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.7'
          cache: true

      - name: Build GUI bundle
        run: packaging/build-gui.sh

      - name: Archive GUI
        run: tar -C dist -czf gui.tar.gz gui

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui
          path: gui.tar.gz

      - name: Upload Dart debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: gui-debug-symbols
          path: build/gui-symbols

  package:
    needs: [build-backend, build-gui]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build-packages.sh reads the version from the latest tag

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Unpack bundles
        run: |
          mkdir -p dist
          tar -C dist -xzf artifacts/backend/backend.tar.gz
          tar -C dist -xzf artifacts/gui/gui.tar.gz

      - name: Build .deb, .rpm and Arch packages
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            packaging/build-packages.sh "${GITHUB_REF_NAME}"
          else
            packaging/build-packages.sh
          fi

      - name: Test packages on Debian, Ubuntu, Fedora and Arch
        run: packaging/test-packages.sh

      - name: Upload packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/packages

  release:
    needs: [package]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout changelog
        uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v tag="${GITHUB_REF_NAME}" '
            index($0, "## [" tag "]") == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::No '## [${GITHUB_REF_NAME}]' section found in CHANGELOG.md; publishing only the auto-generated notes."
            echo "_This tag has no section in CHANGELOG.md._" > release-notes.md
          fi

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "Select-to-Speech ${{ github.ref_name }}"
          generate_release_notes: true
          body_path: release-notes.md
          files: packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
