name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers on tag pushes like v1.0.0, v2.1.3

permissions:
  contents: write # Required to upload assets to GitHub Releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libayatana-appindicator3-dev patchelf libsndfile1-dev libpulse-dev libasound2-dev xvfb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: nuitka-backend-${{ github.ref_name }}
          restore-keys: |
            nuitka-backend-

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv pip install --system . nuitka ordered-set

      - name: Create entry points
        run: |
          cat > run_main.py << 'ENTRY'
          from select_to_speech.main import main
          import sys
          if __name__ == "__main__":
              sys.exit(main())
          ENTRY
          sed -i 's/^          //' run_main.py

          cat > run_check.py << 'ENTRY'
          import sys
          from select_to_speech.system_check import main_check
          if __name__ == "__main__":
              sys.exit(main_check())
          ENTRY
          sed -i 's/^          //' run_check.py

          cat > run_audio.py << 'ENTRY'
          import sys
          from select_to_speech.system_check import main_audio_devices
          if __name__ == "__main__":
              sys.exit(main_audio_devices())
          ENTRY
          sed -i 's/^          //' run_audio.py

          cat > run_download.py << 'ENTRY'
          from select_to_speech.voice_manager import download_kokoro_cli
          if __name__ == "__main__":
              download_kokoro_cli()
          ENTRY
          sed -i 's/^          //' run_download.py

      - name: Build all binaries with Nuitka
        run: |
          # Resolve data directories once
          KOKORO_DIR=$(python -c "import kokoro_onnx; from pathlib import Path; print(Path(kokoro_onnx.__file__).parent)")
          ESPEAK_DIR=$(python -c "import espeakng_loader; from pathlib import Path; print(Path(espeakng_loader.__file__).parent)")
          # Common Nuitka flags
          # Note: ccache is already in PATH via hendrikmuhs/ccache-action symlinks
          NUITKA_FLAGS=(
            --onefile
            --include-package=select_to_speech
            --include-package=kokoro_onnx
            --include-package=espeakng_loader
            --include-package=onnxruntime
            --include-package=misaki
            --include-package=dlinfo
            --include-package=phonemizer
            --include-package=uvicorn
            --include-package=fastapi
            --include-package=pydantic
            --include-package=pulsectl
            --include-package=lingua
            --include-package=pedalboard
            --include-package=pynput
            --include-package=soundfile
            --include-package=_cffi_backend
            --include-package=pyaudio
            --include-package=yaml
            --include-package=emoji
            --include-package=requests
            --include-package=urllib3
            --include-package=certifi
            --include-package-data=misaki
            --include-package-data=language_tags
            --include-package-data=csvw
            --include-package-data=segments
            --include-package-data=phonemizer
            --include-package-data=lingua
            --include-package-data=emoji
            --include-package-data=certifi
            --include-distribution-metadata=kokoro-onnx
            --include-data-dir="$KOKORO_DIR=kokoro_onnx"
            --include-data-dir="$ESPEAK_DIR=espeakng_loader"
            --include-data-files="$KOKORO_DIR/config.json=kokoro_onnx/config.json"
          )

          build_binary() {
            local output_name="$1"
            local entry_file="$2"
            echo ""
            echo "=========================================="
            echo "Building $output_name"
            echo "=========================================="
            python -m nuitka "${NUITKA_FLAGS[@]}" \
              --output-filename="$output_name" \
              "$entry_file"
          }

          build_binary "select-to-speech"          "run_main.py"
          build_binary "select-to-speech-check"    "run_check.py"
          build_binary "select-to-speech-audio"    "run_audio.py"
          build_binary "select-to-speech-download" "run_download.py"

      - name: Smoke test binaries
        run: |
          echo "--- Testing select-to-speech ---"
          xvfb-run -a ./select-to-speech --help
          echo "--- Testing select-to-speech-check ---"
          xvfb-run -a ./select-to-speech-check --help
          echo "--- Testing select-to-speech-audio ---"
          xvfb-run -a ./select-to-speech-audio --help
          echo "--- Testing select-to-speech-download ---"
          xvfb-run -a ./select-to-speech-download --help

      - name: Package Backend
        run: |
          mkdir -p dist
          cp select-to-speech select-to-speech-check select-to-speech-audio select-to-speech-download dist/
          chmod +x dist/*
          tar -czf select-to-speech-backend-linux.tar.gz -C dist .

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-linux
          path: select-to-speech-backend-linux.tar.gz

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: |
          cd src/ui
          flutter pub get

      - name: Build Flutter Linux Release
        run: |
          cd src/ui
          flutter build linux --release

      - name: Package GUI Bundle
        run: |
          # Package the release bundle
          tar -czf select-to-speech-gui-linux.tar.gz -C src/ui/build/linux/x64/release/bundle .

      - name: Upload GUI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-linux
          path: select-to-speech-gui-linux.tar.gz

  release:
    needs: [build-backend, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-linux
          
      - name: Download GUI Artifact
        uses: actions/download-artifact@v4
        with:
          name: gui-linux
          
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "Select-to-Speech ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            select-to-speech-backend-linux.tar.gz
            select-to-speech-gui-linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
