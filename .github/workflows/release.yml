name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers on tag pushes like v1.0.0, v2.1.3

permissions:
  contents: write # Required to upload assets to GitHub Releases

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libayatana-appindicator3-dev patchelf ccache

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install . nuitka ordered-set

      - name: Build select-to-speech
        run: |
          cat << 'EOF' > run_main.py
          from select_to_speech.main import main
          import sys
          if __name__ == "__main__":
              sys.exit(main())
          EOF
          KOKORO_DIR=$(python -c "import kokoro_onnx; from pathlib import Path; print(Path(kokoro_onnx.__file__).parent)")
          python -m nuitka --onefile \
            --include-package=select_to_speech --include-package=kokoro_onnx --include-package=onnxruntime --include-package=misaki --include-package=uvicorn --include-package=fastapi --include-package=pydantic \
            --include-package-data=kokoro_onnx --include-package-data=misaki \
            --include-data-dir="$KOKORO_DIR=kokoro_onnx" \
            --output-filename=select-to-speech \
            run_main.py

      - name: Build select-to-speech-check
        run: |
          cat << 'EOF' > run_check.py
          from select_to_speech.system_check import check_system_dependencies
          if __name__ == "__main__":
              check_system_dependencies()
          EOF
          KOKORO_DIR=$(python -c "import kokoro_onnx; from pathlib import Path; print(Path(kokoro_onnx.__file__).parent)")
          python -m nuitka --onefile \
            --include-package=select_to_speech --include-package=kokoro_onnx --include-package=onnxruntime --include-package=misaki --include-package=uvicorn --include-package=fastapi --include-package=pydantic \
            --include-package-data=kokoro_onnx --include-package-data=misaki \
            --include-data-dir="$KOKORO_DIR=kokoro_onnx" \
            --output-filename=select-to-speech-check \
            run_check.py

      - name: Build select-to-speech-audio
        run: |
          cat << 'EOF' > run_audio.py
          from select_to_speech.system_check import list_audio_devices
          if __name__ == "__main__":
              list_audio_devices()
          EOF
          KOKORO_DIR=$(python -c "import kokoro_onnx; from pathlib import Path; print(Path(kokoro_onnx.__file__).parent)")
          python -m nuitka --onefile \
            --include-package=select_to_speech --include-package=kokoro_onnx --include-package=onnxruntime --include-package=misaki --include-package=uvicorn --include-package=fastapi --include-package=pydantic \
            --include-package-data=kokoro_onnx --include-package-data=misaki \
            --include-data-dir="$KOKORO_DIR=kokoro_onnx" \
            --output-filename=select-to-speech-audio \
            run_audio.py

      - name: Build select-to-speech-download
        run: |
          cat << 'EOF' > run_download.py
          from select_to_speech.voice_manager import download_kokoro_cli
          if __name__ == "__main__":
              download_kokoro_cli()
          EOF
          KOKORO_DIR=$(python -c "import kokoro_onnx; from pathlib import Path; print(Path(kokoro_onnx.__file__).parent)")
          python -m nuitka --onefile \
            --include-package=select_to_speech --include-package=kokoro_onnx --include-package=onnxruntime --include-package=misaki --include-package=uvicorn --include-package=fastapi --include-package=pydantic \
            --include-package-data=kokoro_onnx --include-package-data=misaki \
            --include-data-dir="$KOKORO_DIR=kokoro_onnx" \
            --output-filename=select-to-speech-download \
            run_download.py

      - name: Package Backend
        run: |
          tar -czf select-to-speech-backend-linux.tar.gz select-to-speech select-to-speech-check select-to-speech-audio select-to-speech-download

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-linux
          path: select-to-speech-backend-linux.tar.gz

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restore tray_manager patched lib
        run: |
          # Download and extract the missing lib directory for tray_manager
          curl -L -o tray_manager.tar.gz https://pub.dev/api/archives/tray_manager-0.5.2.tar.gz
          mkdir -p temp_tray_manager
          tar -xzf tray_manager.tar.gz -C temp_tray_manager
          cp -r temp_tray_manager/lib src/ui/tray_manager_patched/
          rm -rf tray_manager.tar.gz temp_tray_manager

      - name: Build Flutter Linux Release
        run: |
          cd src/ui
          flutter clean
          flutter build linux --release

      - name: Package GUI Bundle
        run: |
          # Package the release bundle
          tar -czf select-to-speech-gui-linux.tar.gz -C src/ui/build/linux/x64/release/bundle .

      - name: Upload GUI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-linux
          path: select-to-speech-gui-linux.tar.gz

  release:
    needs: [build-backend, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-linux
          
      - name: Download GUI Artifact
        uses: actions/download-artifact@v4
        with:
          name: gui-linux
          
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            select-to-speech-backend-linux.tar.gz
            select-to-speech-gui-linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
