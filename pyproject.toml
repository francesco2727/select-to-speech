[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "select-to-speech"
version = "0.1.0"
description = "A Wayland-native text-to-speech app for reading selected text with keyboard shortcut"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Francesco", email = "francescov@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pynput>=1.7.6",
    "pyaudio>=0.2.13",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "lingua-language-detector",
    "pedalboard>=0.9.8",
    "kokoro-onnx",
    "onnxruntime",
    "soundfile",
    "requests",
    "misaki",
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
    "emoji>=2.12.0",
    "pulsectl>=24.4.0",
]

[project.scripts]
select-to-speech = "select_to_speech.main:main"
select-to-speech-check = "select_to_speech.system_check:main_check"
select-to-speech-audio = "select_to_speech.system_check:main_audio_devices"
select-to-speech-download = "select_to_speech.voice_manager:download_kokoro_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/select_to_speech"]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
]
